name: Build & Package ReSukiSU

# 仅在 lineage-22.2 分支有提交时自动编译打包（tag/其它分支不触发，
# 避免发 Release 时对同一提交重复编译）；也可手动触发。
on:
  push:
    branches:
      - lineage-22.2
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ReSukiSU 版本码 = 30000 + 提交数 + 700，浅克隆会导致版本码只有 30701，
      # 低于管理器要求的 34634，所以必须取回子模块完整历史。
      - name: Unshallow ReSukiSU submodule
        run: |
          git -C ReSukiSU fetch --unshallow origin || true
          echo "ReSukiSU commit count: $(git -C ReSukiSU rev-list --count HEAD)"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make flex bison bc \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Build kernel
        run: ./build-resukisu.sh

      - name: Package AnyKernel3 (chiron)
        run: ./package-ak3.sh -D chiron

      - name: Package AnyKernel3 (sagit)
        run: ./package-ak3.sh -D sagit

      - name: Show artifacts
        run: |
          ls -lh *.zip out/arch/arm64/boot/Image.gz-dtb
          sha256sum *.zip out/arch/arm64/boot/Image.gz-dtb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-${{ github.ref_name }}
          path: |
            Chiron-ReSukiSU-Lineage22.2-AnyKernel3.zip
            Sagit-ReSukiSU-Lineage22.2-AnyKernel3.zip
            out/arch/arm64/boot/Image.gz-dtb
            build-resukisu.log
          if-no-files-found: error
          retention-days: 30
